<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16213E"/></marker></defs><rect width="1600" height="1000" fill="#F3F1EA"/><text x="60" y="62" font-family="Georgia,serif" font-size="40" font-weight="700" fill="#16213E">How Earmark works</text><text x="60" y="92" font-family="Georgia,serif" font-size="19" font-style="italic" fill="#5B6275">Ask out loud, follow the sound. Our code decides every position and direction; the AI only picks the action.</text><text x="60" y="150" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#2B3FA6">1   YOU ASK</text><rect x="60" y="170" width="230" height="90" rx="12" fill="#FBE9C6" stroke="#B27A16" stroke-width="1.6"/><text x="175.0" y="208.0" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#16213E">You say</text><text x="175.0" y="232.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#5B6275">“Where are my keys?”</text><rect x="340" y="170" width="230" height="90" rx="12" fill="#FFFFFF" stroke="#16213E" stroke-width="1.6"/><text x="455.0" y="208.0" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#16213E">Mac app</text><text x="455.0" y="232.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#5B6275">hold Space, or type</text><rect x="620" y="170" width="240" height="90" rx="12" fill="#FFFFFF" stroke="#2B3FA6" stroke-width="2.4"/><text x="740.0" y="208.0" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#2B3FA6">Cartesia Ink</text><text x="740.0" y="232.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#5B6275">speech to text</text><rect x="910" y="170" width="240" height="90" rx="12" fill="#FFFFFF" stroke="#2B3FA6" stroke-width="2.4"/><text x="1030.0" y="208.0" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#2B3FA6">Claude</text><text x="1030.0" y="232.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#5B6275">picks one action</text><rect x="1200" y="170" width="260" height="90" rx="12" fill="#FFFFFF" stroke="#2B3FA6" stroke-width="2.4"/><text x="1330.0" y="208.0" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#2B3FA6">Moss</text><text x="1330.0" y="232.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#5B6275">finds the right item</text><path d="M290 215 L340 215" fill="none" stroke="#16213E" stroke-width="1.8" marker-end="url(#a)"/><path d="M570 215 L620 215" fill="none" stroke="#16213E" stroke-width="1.8" marker-end="url(#a)"/><path d="M860 215 L910 215" fill="none" stroke="#16213E" stroke-width="1.8" marker-end="url(#a)"/><path d="M1150 215 L1200 215" fill="none" stroke="#16213E" stroke-width="1.8" marker-end="url(#a)"/><text x="60" y="330" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#2B3FA6">2   EARMARK ANSWERS</text><rect x="1200" y="350" width="260" height="100" rx="12" fill="#FFFFFF" stroke="#16213E" stroke-width="1.6"/><text x="1330.0" y="384.0" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#16213E">Our code</text><text x="1330.0" y="408.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#5B6275">works out direction,</text><text x="1330.0" y="428.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#5B6275">distance and steps</text><rect x="910" y="350" width="240" height="100" rx="12" fill="#FFFFFF" stroke="#2B3FA6" stroke-width="2.4"/><text x="1030.0" y="393.0" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#2B3FA6">Cartesia Sonic</text><text x="1030.0" y="417.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#5B6275">speaks the reply</text><rect x="620" y="350" width="240" height="100" rx="12" fill="#FFFFFF" stroke="#16213E" stroke-width="1.6"/><text x="740.0" y="384.0" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#16213E">Mac app + AirPods</text><text x="740.0" y="408.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#5B6275">3D ping that follows</text><text x="740.0" y="428.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#5B6275">your head</text><rect x="340" y="350" width="230" height="100" rx="12" fill="#FBE9C6" stroke="#B27A16" stroke-width="1.6"/><text x="455.0" y="393.0" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#16213E">You hear it</text><text x="455.0" y="417.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#5B6275">turn toward the sound</text><path d="M1330 260 L1330 350" fill="none" stroke="#16213E" stroke-width="1.8" marker-end="url(#a)"/><path d="M1200 400 L1150 400" fill="none" stroke="#16213E" stroke-width="1.8" marker-end="url(#a)"/><path d="M1330 450 L1330 472 L740 472 L740 450" fill="none" stroke="#16213E" stroke-width="1.8" marker-end="url(#a)"/><path d="M910 400 L860 400" fill="none" stroke="#16213E" stroke-width="1.8" marker-end="url(#a)"/><path d="M620 400 L570 400" fill="none" stroke="#16213E" stroke-width="1.8" marker-end="url(#a)"/><text x="60" y="520" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#2B3FA6">3   WHERE YOU STAND</text><rect x="60" y="540" width="240" height="100" rx="12" fill="#FFFFFF" stroke="#16213E" stroke-width="1.6"/><text x="180.0" y="574.0" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#16213E">3 phone beacons</text><text x="180.0" y="598.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#5B6275">each plays a chirp</text><text x="180.0" y="618.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#5B6275">every half second</text><rect x="350" y="540" width="240" height="100" rx="12" fill="#FFFFFF" stroke="#16213E" stroke-width="1.6"/><text x="470.0" y="583.0" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#16213E">Your phone</text><text x="470.0" y="607.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#5B6275">listens and records</text><rect x="640" y="540" width="260" height="100" rx="12" fill="#FFFFFF" stroke="#16213E" stroke-width="1.6"/><text x="770.0" y="574.0" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#16213E">Mac</text><text x="770.0" y="598.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#5B6275">times each chirp and</text><text x="770.0" y="618.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#5B6275">turns it into distance</text><rect x="950" y="540" width="260" height="100" rx="12" fill="#FFFFFF" stroke="#16213E" stroke-width="1.6"/><text x="1080.0" y="583.0" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#16213E">Your position</text><text x="1080.0" y="607.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#5B6275">updates live</text><path d="M300 590 L350 590" fill="none" stroke="#16213E" stroke-width="1.8" marker-end="url(#a)"/><path d="M590 590 L640 590" fill="none" stroke="#16213E" stroke-width="1.8" marker-end="url(#a)"/><path d="M900 590 L950 590" fill="none" stroke="#16213E" stroke-width="1.8" marker-end="url(#a)"/><path d="M1210 590 L1300 590 L1300 450" fill="none" stroke="#16213E" stroke-width="1.8" marker-end="url(#a)"/><text x="1230" y="630" font-family="Helvetica,Arial,sans-serif" font-size="14" font-style="italic" fill="#5B6275">feeds the directions</text><text x="60" y="720" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#2B3FA6">4   MEMORY AND FAMILY</text><rect x="60" y="745" width="240" height="100" rx="12" fill="#FFFFFF" stroke="#16213E" stroke-width="1.6"/><text x="180.0" y="788.0" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#16213E">Family dashboard</text><text x="180.0" y="812.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#5B6275">map, timeline, medication</text><rect x="340" y="745" width="260" height="100" rx="12" fill="#FFFFFF" stroke="#2B3FA6" stroke-width="2.4"/><text x="470.0" y="779.0" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#2B3FA6">Fetch.ai agent</text><text x="470.0" y="803.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#5B6275">the memory agent answers</text><text x="470.0" y="823.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#5B6275">family questions in ASI:One</text><rect x="650" y="745" width="240" height="100" rx="12" fill="#FFFFFF" stroke="#2B3FA6" stroke-width="2.4"/><text x="770.0" y="779.0" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#2B3FA6">Convex</text><text x="770.0" y="803.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#5B6275">stores everything,</text><text x="770.0" y="823.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#5B6275">updates live</text><rect x="940" y="745" width="240" height="100" rx="12" fill="#FFFFFF" stroke="#16213E" stroke-width="1.6"/><text x="1060.0" y="779.0" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#16213E">Hub</text><text x="1060.0" y="803.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#5B6275">keeps item state</text><text x="1060.0" y="823.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#5B6275">and events</text><rect x="1230" y="745" width="240" height="100" rx="12" fill="#FFFFFF" stroke="#16213E" stroke-width="1.6"/><text x="1350.0" y="788.0" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#16213E">Tagged spots</text><text x="1350.0" y="812.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#5B6275">readers under items</text><path d="M1230 795 L1180 795" fill="none" stroke="#16213E" stroke-width="1.8" marker-end="url(#a)"/><path d="M940 795 L890 795" fill="none" stroke="#16213E" stroke-width="1.8" marker-end="url(#a)"/><path d="M650 795 L600 795" fill="none" stroke="#16213E" stroke-width="1.8" marker-end="url(#a)"/><path d="M770 845 L770 880 L180 880 L180 845" fill="none" stroke="#16213E" stroke-width="1.8" marker-end="url(#a)"/><path d="M1460 400 L1540 400 L1540 920 L1060 920 L1060 845" fill="none" stroke="#16213E" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#a)"/><text x="1150" y="913" font-family="Helvetica,Arial,sans-serif" font-size="14" font-style="italic" fill="#5B6275">“I put my keys in the drawer” is saved</text><text x="60" y="965" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#5B6275">Blue boxes are sponsor tools. Dashed line: saving where you put things.</text></svg>