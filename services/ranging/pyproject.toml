[project]
name = "earmark-ranging"
version = "0.1.0"
description = "Earmark ranging: works out where the user's phone is from chirps played and heard by phones around the room."
requires-python = ">=3.11"
dependencies = [
    "earmark-contracts",
    "numpy>=2.0",
    "scipy>=1.14",
    "websockets>=17.3",
]

[project.scripts]
earmark-ranging = "earmark_ranging.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["earmark_ranging"]

[tool.uv.sources]
earmark-contracts = { path = "../../contracts/python", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["F", "E", "W", "B"]
