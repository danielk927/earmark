[project]
name = "earmark-memory-agent"
version = "0.1.0"
description = "Earmark memory agent: a Fetch.ai uAgent (Chat Protocol) that answers caregiver questions from Earmark's Convex records, reasoning with a Bitdeer-hosted model."
requires-python = ">=3.11,<3.14"
dependencies = [
    "earmark-contracts",
    "uagents>=0.26.1,<0.27",
    "openai>=1.60,<3",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
earmark-memory = "earmark_memory.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "jsonschema>=4.22", "referencing>=0.35"]

[tool.uv.sources]
earmark-contracts = { path = "../../contracts/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["earmark_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
