[project]
name = "earmark-concierge"
version = "0.1.0"
description = "Earmark voice concierge: speech in, intent, object resolution, guidance and speech out."
requires-python = ">=3.12,<3.13"
dependencies = [
    "earmark-contracts",
    "httpx>=0.28.1",
    "moss>=1.21,<2",
    "openai>=3.37.0",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
    "tzdata>=2026.5",
    "websockets>=17.3",
]

[project.scripts]
earmark-concierge = "earmark_concierge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["earmark_concierge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv.sources]
earmark-contracts = { path = "../../contracts/python", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "B"]
