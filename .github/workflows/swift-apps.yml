name: Swift apps
# Compiles and tests the Swift that the locator-* workflows do not: contracts/swift, mac/, ios/EarmarkUWB and
# locator/ios/EarmarkPhone. Same steps as scripts/mac_check.sh (its logs are uploaded when a job fails).
on:
  pull_request:
    paths:
      - 'mac/**'
      - 'ios/**'
      - 'contracts/swift/**'
      - 'contracts/examples/**'
      - 'locator/ios/EarmarkPhone/**'
      - 'scripts/mac_check.sh'
      - '.github/workflows/swift-apps.yml'
  push:
    branches: [main]
    paths:
      - 'mac/**'
      - 'ios/**'
      - 'contracts/swift/**'
      - 'contracts/examples/**'
      - 'locator/ios/EarmarkPhone/**'
      - 'scripts/mac_check.sh'
      - '.github/workflows/swift-apps.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: swift-apps-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts-swift:
    name: contracts/swift tests
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16 (Swift 6 tools, swift-testing)
        run: |
          x=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          sudo xcode-select -s "$x"
          swift --version
      - run: cd contracts/swift && swift test
  mac:
    name: Mac app build and tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16 (Swift 6 tools, swift-testing)
        run: |
          x=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          sudo xcode-select -s "$x"
          swift --version
      - run: bash scripts/mac_check.sh --only mac
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ github.job }}-logs
          path: logs/mac_check/
          if-no-files-found: warn
  ios-uwb:
    name: EarmarkUWB build and tests
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16 (Swift 6 tools, swift-testing)
        run: |
          x=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          sudo xcode-select -s "$x"
          swift --version
      - run: brew install xcodegen
      - name: Available iPhone simulators (mac_check.sh uses the first)
        run: xcrun simctl list devices available | grep iPhone || true
      - run: bash scripts/mac_check.sh --only ios-uwb
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ github.job }}-logs
          path: logs/mac_check/
          if-no-files-found: warn
  earmark-phone:
    name: EarmarkPhone tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16 (Swift 6 tools, swift-testing)
        run: |
          x=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          sudo xcode-select -s "$x"
          swift --version
      - run: swift test --package-path locator/ios/EarmarkPhone
