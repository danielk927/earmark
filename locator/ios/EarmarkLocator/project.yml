name: EarmarkLocator
options:
  projectFormat: xcode15_3
  xcodeVersion: '15.4'
  bundleIdPrefix: com.earmark
  deploymentTarget:
    iOS: '17.0'
packages:
  EarmarkCore:
    path: ../EarmarkCore
targets:
  EarmarkLocator:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: EarmarkCore
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Earmark Locator
        CFBundleShortVersionString: '1.0'
        CFBundleVersion: '1'
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Earmark listens for acoustic beacons and streams your voice while push-to-talk is active.
        NSLocalNetworkUsageDescription: Earmark sends your position and push-to-talk audio to your Mac hub.
        NSMotionUsageDescription: Earmark may use motion for an optional walking fallback.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.earmark.locator
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ''
