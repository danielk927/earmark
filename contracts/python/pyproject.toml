[project]
name = "earmark-contracts"
version = "0.1.0"
description = "Earmark message contracts: pydantic models mirroring contracts/schemas."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4.22", "referencing>=0.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["earmark_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
